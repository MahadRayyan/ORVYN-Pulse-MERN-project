services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - pulse_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/orvyn_pulse
      APP_URL: http://localhost:4000
      PORT: 4000
      # Local HTTP demonstration only. Hosted HTTPS deployments use production.
      NODE_ENV: development
      META_REDIRECT_URI: http://localhost:4000/api/meta/callback
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  pulse_data:
